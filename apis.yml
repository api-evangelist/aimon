aid: aimon
name: AIMon
description: 'AIMon (AIMon Labs) is an enterprise AI monitoring, evaluation, and governance
  platform that helps teams ship trustworthy LLM, RAG, and agentic AI applications. Its API
  and SDKs detect hallucinations and quality issues (instruction adherence, context quality,
  conciseness, completeness, toxicity) across offline evaluation, continuous production
  monitoring, and inline/real-time detection. Developers create applications and models,
  run evaluations and evaluation runs, retrieve evaluation and production metrics, and
  manage datasets, dataset records, and dataset collections through a REST API (base
  https://sdkbe-production.aimon.ai) with Bearer API-key authentication, plus official
  Python and TypeScript SDKs and a LlamaIndex integration. Surfaced as a portfolio company
  of Bessemer Venture Partners; sector ai-ml.'
